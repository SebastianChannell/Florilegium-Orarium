<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070606">
    <meta name="color-scheme" content="dark">
    <meta id="meta-description" name="description" content="A quiet, searchable collection of prayers and hymns in their original languages.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Orarium — Sacrum Florilegium</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./reader-language.css">
    <script type="module" src="./app.js"></script>
    <script type="module" src="./reader-language.js"></script>
    <script type="module" src="./sections.js"></script>
  </head>
  <body>
    <a id="skip-link" class="skip-link" href="#main-content">Skip to texts</a>

    <div class="site-shell">
      <header class="site-header">
        <a id="home-link" class="wordmark" href="./" aria-label="Orarium home">
          <span>Sacrum Florilegium</span>
          <strong>Orarium</strong>
        </a>
        <p class="subtitle">Oráte et psállite Dómino.</p>
        <details class="florilegium-menu">
          <summary>
            <span>Sites</span>
            <span class="florilegium-menu-chevron" aria-hidden="true"></span>
          </summary>
          <nav aria-label="Sacrum Florilegium sites">
            <p>Sacrum Florilegium</p>
            <a href="https://sacrumflorilegium.com/">Domus</a>
            <a href="https://biblia.sacrumflorilegium.com/">Biblia</a>
            <a href="https://florilegium-census.sebastianchannell99.workers.dev/">Census</a>
            <a href="https://librarium.sacrumflorilegium.com/">Librarium</a>
            <a href="https://officium.sacrumflorilegium.com/">Officium</a>
            <a href="https://orarium.sacrumflorilegium.com/" aria-current="page">Orarium</a>
            <a href="https://propria.sacrumflorilegium.com/">Propria</a>
          </nav>
        </details>
      </header>

      <main id="main-content">
        <section id="browse-view" aria-labelledby="browse-heading">
          <h1 id="browse-heading" class="visually-hidden">Prayers and hymns</h1>

          <form class="search" role="search" id="search-form">
            <label id="search-label" class="visually-hidden" for="search-input">Search prayers and hymns</label>
            <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
              <circle cx="11" cy="11" r="6.5"></circle>
              <path d="m16 16 4 4"></path>
            </svg>
            <input
              id="search-input"
              name="q"
              type="search"
              inputmode="search"
              autocomplete="off"
              spellcheck="false"
              placeholder="Search title, opening words, or text"
            >
            <button id="clear-search" class="search-clear" type="button" aria-label="Clear search" hidden>×</button>
          </form>

          <details id="type-filter" class="type-filter">
            <summary>
              <span>Type</span>
              <span id="type-selection" class="type-selection" aria-live="polite">All</span>
            </summary>
            <div class="type-panel">
              <fieldset>
                <legend class="visually-hidden">Choose a text type</legend>
                <div id="type-options" class="type-options">
                  <label class="type-option"><input type="radio" name="type" value="all" data-filter="all" checked><span>All</span></label>
                  <label class="type-option"><input type="radio" name="type" value="prayer" data-filter="prayer"><span>Prayers</span></label>
                  <label class="type-option"><input type="radio" name="type" value="hymn" data-filter="hymn"><span>Hymns</span></label>
                </div>
              </fieldset>
            </div>
          </details>

          <a class="add-text-button" href="./add/">+ Add prayer or hymn</a>

          <div class="browse-tools">
            <p id="result-count" class="result-count" aria-live="polite">Loading…</p>
          </div>

          <div id="status-message" class="status-message" hidden></div>
          <nav id="results" class="index-groups" aria-label="Devotional index"></nav>
        </section>

        <article id="reader-view" class="reader" aria-labelledby="reader-title" hidden>
          <button id="back-button" class="back-button" type="button">← All texts</button>
          <h1 id="reader-title" tabindex="-1"></h1>
          <div id="language-switch" class="language-switch reader-language-switch" role="group" aria-label="Prayer language" hidden>
            <button class="language-button is-active" type="button" data-language="en" aria-pressed="true">English</button>
            <button class="language-button" type="button" data-language="la" aria-pressed="false">Latin</button>
            <button class="language-button" type="button" data-language="es" aria-pressed="false">Español</button>
            <button class="language-button" type="button" data-language="it" aria-pressed="false">Italiano</button>
          </div>
          <nav id="office-hours" class="office-hours" aria-label="Office Hours" hidden>
            <p id="office-hours-label" class="office-hours-label">Hours</p>
            <ol id="office-hours-list" class="office-hours-list"></ol>
          </nav>
          <div id="reader-text" class="reader-text" dir="auto"></div>
        </article>
      </main>

      <footer class="site-footer">
        <span aria-hidden="true">✠</span>
        <span>T.A.D.M.N.</span>
      </footer>
    </div>

    <noscript>
      <p class="noscript">JavaScript is required to search and open the texts.</p>
    </noscript>
  </body>
</html>
